name: Deploy to Cloudflare

# Runs on every push to main to keep deployments automatic.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Pull the repository code into the runner.
      - name: Checkout
        uses: actions/checkout@v4

      # Install Node.js for the frontend build.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # Install dependencies and build the React frontend.
      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Deploy the static site to Cloudflare Pages.
      # Replace projectName with your Pages project name in Cloudflare.
      - name: Deploy Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: family-tree
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Deploy the Worker API with Wrangler.
      # Secrets (JWT_SECRET, etc.) should be added using wrangler secret put.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

      # WARNING: Never commit secrets to the repo. Use GitHub Secrets instead.
