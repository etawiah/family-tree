name = "family-tree-app"
main = "worker.js"
compatibility_date = "2024-01-25"

# Keep workers.dev and preview URLs off so `wrangler deploy` in CI
# does not re-enable the public workers.dev hostname.
workers_dev = false
preview_urls = false

# Route family-tree.tawiah.net/api/* -> family-tree-app is managed in the
# Cloudflare dashboard because the CI token can't edit routes.

# D1 database for tree data
[[d1_databases]]
binding = "DB"
database_name = "family-tree-db"
database_id = "65e3242b-ea09-4ee1-9aa7-624f8f56a9c2"

# Private R2 bucket (not a public hostname). Photos are served via /api/photo/:file.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "family-tree-photos"

# CORS allowed origins (custom domain + local dev).
# pages.dev previews cannot authenticate to Access; workers.dev is disabled.
# For auth gate: set PAGES_ORIGIN and TURNSTILE_SITE_KEY (vars); AUTH_SECRET, PASSWORD, TURNSTILE_SECRET_KEY (secrets)
[vars]
CORS_ORIGINS = "https://family-tree.tawiah.net,http://localhost:5173,http://localhost:5174"
PAGES_ORIGIN = "https://family-tree.pages.dev"
TURNSTILE_SITE_KEY = ""
