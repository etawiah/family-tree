name = "family-tree-app"
main = "worker.js"
compatibility_date = "2024-01-25"

# D1 database for tree data
[[d1_databases]]
binding = "DB"
database_name = "family-tree-db"
database_id = "65e3242b-ea09-4ee1-9aa7-624f8f56a9c2"

# R2 Bucket for photo storage
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "family-tree-photos"

# CORS allowed origins (Pages app + local dev)
[vars]
CORS_ORIGINS = "https://family-tree.tawiah.net,https://family-tree-a6g.pages.dev,https://family-tree-app.pages.dev,https://family-tree-app.eugene-tawiah.workers.dev,http://localhost:5173,http://localhost:5174"
